name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build and run offline tests
        env:
          RESAVE_TEST_FIXTURE_ONLY: '1'
        run: ./script/build_and_run.sh --build-only
      - name: Check app and release version
        shell: bash
        run: |
          APP="../RESaveEditorBuild/Resident Evil Save Editor.app"
          codesign --verify --deep --strict "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/RESaveEditor")" = arm64
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
      - name: Package app
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent "$GITHUB_WORKSPACE/../RESaveEditorBuild/Resident Evil Save Editor.app" Resident-Evil-Save-Editor-macOS-arm64.zip
          shasum -a 256 Resident-Evil-Save-Editor-macOS-arm64.zip > Resident-Evil-Save-Editor-macOS-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Resident-Evil-Save-Editor-macOS-arm64
          path: |
            ${{ runner.temp }}/Resident-Evil-Save-Editor-macOS-arm64.zip
            ${{ runner.temp }}/Resident-Evil-Save-Editor-macOS-arm64.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Resident-Evil-Save-Editor-macOS-arm64
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sha256sum -c Resident-Evil-Save-Editor-macOS-arm64.zip.sha256
          gh release create "$GITHUB_REF_NAME" Resident-Evil-Save-Editor-macOS-arm64.zip Resident-Evil-Save-Editor-macOS-arm64.zip.sha256 --verify-tag --generate-notes --title "Resident Evil Save Editor $GITHUB_REF_NAME"
